<section id="cantina_contact" class="contact-section">
  <div class="container">
    <h2 class="section-title fade-in">Contattaci</h2>
    <p class="section-subtitle fade-in">Siamo qui per rispondere alle tue domande</p>
    <div class="contact-content">
      <div class="contact-info fade-in">
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div>
            <h3>Indirizzo</h3>
            <p>Via delle Vigne 123<br>50100 Firenze, Italia</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div>
            <h3>Telefono</h3>
            <p>+39 055 123 4567</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div>
            <h3>Email</h3>
            <p>info&#64;cantinavinicola.it</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div>
            <h3>Orari di Apertura</h3>
            <p>Lun-Sab: 9:00 - 18:00<br>Domenica: Su prenotazione</p>
          </div>
        </div>
      </div>
      <form class="contact-form fade-in" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input 
            type="text" 
            id="name" 
            name="name"
            [(ngModel)]="formData.name"
            required
            placeholder="Il tuo nome"
          >
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email"
            [(ngModel)]="formData.email"
            required
            placeholder="tua.email&#64;esempio.it"
          >
        </div>
        <div class="form-group">
          <label for="phone">Telefono</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone"
            [(ngModel)]="formData.phone"
            placeholder="+39 123 456 7890"
          >
        </div>
        <div class="form-group">
          <label for="message">Messaggio</label>
          <textarea 
            id="message" 
            name="message"
            [(ngModel)]="formData.message"
            required
            rows="5"
            placeholder="Come possiamo aiutarti?"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-submit">Invia Messaggio</button>
      </form>
    </div>
  </div>
</section>
